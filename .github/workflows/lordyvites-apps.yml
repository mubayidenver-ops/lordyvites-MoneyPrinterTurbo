name: Build Lordyvites Windows and Android apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/lordyvites-apps.yml']
permissions:
  contents: read
concurrency:
  group: lordyvites-apps
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/
            /apps/
            /LICENSE
            /config.example.toml
            /requirements.txt
            /requirements-security.txt
            /pyproject.toml
            /cli.py
            /resource/fonts/BeVietnamPro-Medium.ttf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and test pairing
        run: |
          python -m pip install uv fastapi==0.136.3 httpx
          python -m unittest apps.pc.test_server -v
      - name: Assemble Python, video engine and studio
        run: python apps/pc/build_windows.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" apps/pc/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        working-directory: apps/android
        run: gradle assembleRelease lintRelease --no-daemon
      - name: Verify release signing and source match
        if: hashFiles('apps/releases/Lordyvites-Studio-Android.apk') != ''
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs apps/releases/Lordyvites-Studio-Android.apk
          python3 apps/android/verify_apk.py apps/android/app/build/outputs/apk/release/app-release-unsigned.apk apps/releases/Lordyvites-Studio-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-files
      - name: Include signed Android app when available
        run: |
          if [ -f apps/releases/Lordyvites-Studio-Android.apk ]; then
            cp apps/releases/Lordyvites-Studio-Android.apk release-files/
          fi
          sha256sum release-files/* > release-files/SHA256SUMS.txt
      - name: Publish GitHub downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apps-0.1.${{ github.run_number }}" release-files/* --target "${{ github.sha }}" --title "Lordyvites apps · 0.1.${{ github.run_number }}" --notes-file apps/RELEASE-NOTES.md --prerelease
